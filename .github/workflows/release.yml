name: Release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset (MSI)
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wixBin)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            throw "WiX bin directory not found: $wixBin"
          }
          echo "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build Windows distributables
        run: .\scripts\build-windows.ps1
        shell: pwsh

      - name: Stage Windows release assets
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path 'desktop\build.gradle.kts' -Pattern 'packageVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $out = 'dist\windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portable = Get-ChildItem 'desktop\build\compose\binaries\main\zip\*-portable.zip' | Select-Object -First 1
          if (-not $portable) { throw 'Portable zip not found' }
          Copy-Item $portable.FullName (Join-Path $out "Task-Worktree-Manager-$version-windows-portable.zip")

          $exe = Get-ChildItem 'desktop\build\compose\binaries\main\exe\*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'EXE installer not found' }
          Copy-Item $exe.FullName (Join-Path $out "Task-Worktree-Manager-$version-windows-setup.exe")

          $msi = Get-ChildItem 'desktop\build\compose\binaries\main\msi\*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer not found' }
          Copy-Item $msi.FullName (Join-Path $out "Task-Worktree-Manager-$version-windows.msi")

          $cli = Get-ChildItem 'cli\build\distributions\*.zip' | Select-Object -First 1
          if (-not $cli) { throw 'CLI zip not found' }
          Copy-Item $cli.FullName (Join-Path $out "taskwt-$version-windows-cli.zip")

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-ChildItem $out | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS packages
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS distributables
        run: |
          # These files may be checked out with CRLF from a Windows workspace.
          # Normalize them before executing them on the macOS runner.
          perl -pi -e 's/\r$//' ./gradlew ./scripts/build-macos.sh
          chmod +x ./gradlew ./scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*packageVersion *= *"\([^"]*\)".*/\1/p' desktop/build.gradle.kts | head -n1)
          mkdir -p dist/macos
          dmg=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -n1)
          cli=$(ls cli/build/distributions/*.zip | head -n1)
          cp "$dmg" "dist/macos/Task-Worktree-Manager-${version}-macos.dmg"
          cp "$cli" "dist/macos/taskwt-${version}-macos-cli.zip"
          ls -la dist/macos

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: release-assets

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Task Worktree Manager ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build (${short_sha})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          ls -la release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          body: |
            自动构建产物（Compose Desktop + CLI）。

            - **Windows**：绿色 portable zip、Setup EXE、MSI、CLI zip
            - **macOS**：DMG、CLI zip

            Commit: `${{ github.sha }}`
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
